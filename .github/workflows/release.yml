name: Build and Release Packages

# Every push and pull request builds and validates the packages (kept as workflow artifacts).
# A version tag (v1.2.0 or 1.2.0) also publishes them in a GitHub release.
on:
  push:
    branches:
      - master
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build SQL Project
        run: msbuild FastWrappers_TSQL.sqlproj /p:Configuration=Release /p:Platform="Any CPU" /t:Build

      - name: Setup SQL Server 2019 (LocalDB)
        shell: powershell
        run: |
          # The .bak must be created with SQL Server 2019 (database version 904) to be restorable on SQL Server 2019+.
          # The runner ships another LocalDB version, so install LocalDB 2019 side by side.
          Invoke-WebRequest -Uri "https://download.microsoft.com/download/7/c/1/7c14e92e-bdcb-4f89-b7cf-93543e7112d1/SqlLocalDB.msi" -OutFile "SqlLocalDB2019.msi"
          $install = Start-Process msiexec.exe -ArgumentList '/i','SqlLocalDB2019.msi','/qn','IACCEPTSQLLOCALDBLICENSETERMS=YES' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "LocalDB installation failed with exit code $($install.ExitCode)" }

          $localDb = Get-ChildItem 'C:\Program Files\Microsoft SQL Server\*\Tools\Binn\SqlLocalDB.exe' | Sort-Object FullName | Select-Object -Last 1
          & $localDb.FullName versions
          & $localDb.FullName create FW2019 15.0 -s
          if ($LASTEXITCODE -ne 0) { throw "Failed to create the LocalDB 2019 instance" }

      - name: Download SqlPackage
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/sqlpackage-windows" -OutFile "SqlPackage.zip"
          Expand-Archive -Path "SqlPackage.zip" -DestinationPath "$env:RUNNER_TEMP\SqlPackage" -Force

      - name: Build and validate the packages
        shell: powershell
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: >
          .github\scripts\Build-Packages.ps1
          -ServerInstance "(localdb)\FW2019"
          -SqlPackage "$env:RUNNER_TEMP\SqlPackage\SqlPackage.exe"
          -OutputDir release
          -Tag "$env:RELEASE_TAG"
          -MaxDatabaseVersion 904

      - name: Upload the packages
        uses: actions/upload-artifact@v4
        with:
          name: FastWrappers-TSQL-packages
          path: |
            release/FastWrappers-TSQL.dacpac
            release/FastWrappers-TSQL.bak
            release/FastWrappers-TSQL.sql
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download the packages
        uses: actions/download-artifact@v4
        with:
          name: FastWrappers-TSQL-packages
          path: release

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: FastWrappers-TSQL ${{ github.ref_name }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## Installation files

            | File | Use | SQL Server |
            |---|---|---|
            | **FastWrappers-TSQL.sql** | Self-contained script: installs or upgrades, and can be replayed | 2017+ |
            | **FastWrappers-TSQL.bak** | Backup of the database, to restore | 2019+ |
            | **FastWrappers-TSQL.dacpac** | Data-tier package, to publish with SqlPackage or Visual Studio | 2017+ |

            The `.bak` and the `.dacpac` need a post-installation configuration.
            See the [installation guide and the compatibility table](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/README.md#installation).
          files: |
            release/FastWrappers-TSQL.dacpac
            release/FastWrappers-TSQL.bak
            release/FastWrappers-TSQL.sql
